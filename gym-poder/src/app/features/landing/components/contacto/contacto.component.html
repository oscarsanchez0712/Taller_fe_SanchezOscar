<section id="contacto" class="contacto">
  <div class="contacto-container">
    <h2>Contáctanos</h2>

    <div class="contacto-grid">
      <div class="contacto-info">
        <p><strong>Dirección:</strong> Av. Los Atletas 456, Lima</p>
        <p><strong>Teléfono:</strong> +51 987 654 321</p>
        <p><strong>Correo:</strong> contacto&#64;podergym.com</p>
        <p><strong>Horario:</strong> Lunes a Sábado, 6:00 am - 10:00 pm</p>
      </div>

      <form class="contacto-form">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" />

        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" />

        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" placeholder="Tu teléfono" />

        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje"></textarea>

        <button type="submit" class="btn-enviar">Enviar</button>
      </form>
    </div>
  </div>
</section>
